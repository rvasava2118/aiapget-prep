<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIAPGET Prep - Ayurveda Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    /* Design Tokens - Ayurvedic Palette */
    :root {
      --bg: #F8F9FA;
      --fg: #212529;
      --primary: #1B4332;
      --primary-light: #2D6A4F;
      --accent: #B08968;
      --accent-light: #D4A373;
      --card-bg: #FFFFFF;
      --success: #40916C;
      --warning: #E9C46A;
      --error: #E76F51;
      --border: rgba(27, 67, 50, 0.1);
      --shadow: 0 4px 20px rgba(27, 67, 50, 0.08);
      --font-display: 'Playfair Display', serif;
      --font-body: 'Source Sans Pro', sans-serif;
      --font-heading: 'Playfair Display', serif;
      --font-ui: 'Source Sans Pro', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1A1D1B;
        --fg: #E8EAED;
        --primary: #2D6A4F;
        --primary-light: #40916C;
        --accent: #D4A373;
        --accent-light: #EFE8D6;
        --card-bg: #2A2D2B;
        --border: rgba(27, 67, 50, 0.2);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
    }

    :root[data-theme="dark"] {
      --bg: #1A1D1B;
      --fg: #E8EAED;
      --primary: #2D6A4F;
      --primary-light: #40916C;
      --accent: #D4A373;
      --accent-light: #EFE8D6;
      --card-bg: #2A2D2B;
      --border: rgba(27, 67, 50, 0.2);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }
    img { max-width: 100%; pointer-events: none; }
    [hidden] { display: none !important; }

    /* Anti-Screenshot Overlay / Blur Effect */
    .screenshot-shield {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    body {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #app {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Header */
    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      background: var(--card-bg);
      padding: 16px 24px;
      box-shadow: 0 2px 8px rgba(27, 67, 50, 0.06);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: var(--font-heading);
      font-size: 22px;
      color: var(--primary);
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      font-size: 12px;
      padding: 4px 10px;
      background: rgba(27, 67, 50, 0.1);
      color: var(--primary);
      border-radius: 12px;
      font-weight: 600;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-family: var(--font-heading);
      cursor: pointer;
    }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .auth-card h2 {
      font-family: var(--font-heading);
      font-size: 26px;
      color: var(--primary);
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-card p {
      text-align: center;
      font-size: 14px;
      color: var(--fg);
      opacity: 0.7;
      margin-bottom: 24px;
    }

    .social-login {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      color: var(--fg);
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .social-btn:hover {
      background: rgba(27, 67, 50, 0.05);
      border-color: var(--primary-light);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--fg);
      opacity: 0.5;
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary);
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-primary:hover {
      background: var(--primary-light);
    }

    /* Navigation Tabs */
    nav {
      display: flex;
      justify-content: center;
      padding: 16px 0;
      overflow-x: auto;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      padding: 10px 18px;
      border: none;
      background: transparent;
      color: var(--fg);
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: rgba(27, 67, 50, 0.05);
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Main Container */
    main {
      padding: 0 16px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card h3 {
      font-family: var(--font-heading);
      font-size: 18px;
      color: var(--primary);
      margin-bottom: 12px;
    }

    /* Admin Panel */
    .admin-banner {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upload-box {
      border: 2px dashed var(--border);
      padding: 32px;
      text-align: center;
      border-radius: 12px;
      background: var(--bg);
      cursor: pointer;
      margin-top: 16px;
    }

    /* Footer Nav for Mobile */
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
      opacity: 0.7;
      cursor: pointer;
      background: none;
      border: none;
    }

    .footer-item.active {
      color: var(--primary);
      opacity: 1;
    }

    .footer-item svg {
      width: 20px;
      height: 20px;
    }

    @media(min-width: 768px) {
      .footer-nav { display: none; }
    }
  </style>
</head>
<body>

<!-- Screenshot Shield -->
<div id="screenshotShield" class="screenshot-shield">
  <div>
    <h2 style="font-family: var(--font-heading); color: var(--primary); margin-bottom: 12px;">Security Notice</h2>
    <p>Screenshots and screen recordings are disabled for copyright protection of Ayurvedic study materials.</p>
  </div>
</div>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const [user, setUser] = useState(null); // {username, role: 'admin'|'student'}
    const [activeTab, setActiveTab] = useState('dashboard');
    const [loginUsername, setLoginUsername] = useState('');
    const [loginPassword, setLoginPassword] = useState('');
    const [loginError, setLoginError] = useState('');

    // State for Notes, Medicine Prep, Materials
    const [notes, setNotes] = useState([
      { id: 1, title: 'Charaka Sutrasthana Comprehensive Notes', subject: 'Samhita', author: 'Dr. R. Vasava', date: '2026-11-10' },
      { id: 2, title: 'Dravyaguna Pharmacodynamics & Dravya Classification', subject: 'Dravyaguna', author: 'Admin', date: '2026-11-12' },
      { id: 3, title: 'Shalya Tantra Surgical Instruments Summary', subject: 'Shalya', author: 'Dr. Sharma', date: '2026-11-14' }
    ]);

    const [medicines, setMedicines] = useState([
      { id: 1, name: 'Chyawanprash Awaleha', category: 'Rasayana', ingredients: 'Amla, Dashmool, Ashtaka Varga, Ghrita, Madhu', process: 'Herbal decoction prepared with 500 herbs, fried in ghee/sesame oil and mixed with honey and sugar syrup.' },
      { id: 2, name: 'Maharasnadi Kwath', category: 'Vatavyadhi', ingredients: 'Rasna, Dashmool, Bala, Eranda, Devdaru', process: 'Coarse powder boiled in 16 parts of water reduced to 1/4th on moderate flame.' },
      { id: 3, name: 'Kanakasava', category: 'Swasa/Kasa', ingredients: 'Dhatura, Vasaka, Mulathi, Pippali, Dhataki Pushpa', process: 'Fermentation (Sandhana Kalpana) in earthen pot for 30 days with honey and jaggery.' }
    ]);

    const [materials, setMaterials] = useState([
      { id: 1, title: 'AIAPGET 500 Most Expected MCQs PDF', type: 'PDF Document', size: '14.2 MB' },
      { id: 2, title: 'Sanskrit Terminology Quick Reference Guide', type: 'Cheat Sheet', size: '4.5 MB' },
      { id: 3, title: 'Previous 10 Years Solved Question Papers', type: 'Question Bank', size: '28.1 MB' }
    ]);

    // Admin Upload State
    const [newTitle, setNewTitle] = useState('');
    const [newCategory, setNewCategory] = useState('');
    const [newContent, setNewContent] = useState('');

    // Anti-screenshot keyboard and visibility triggers
    useEffect(() => {
      const handleKeyDown = (e) => {
        if (e.key === 'PrintScreen' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'S' || e.key === 'C'))) {
          e.preventDefault();
          showShield();
        }
      };

      const handleVisibility = () => {
        if (document.hidden) {
          showShield();
        } else {
          hideShield();
        }
      };

      window.addEventListener('keydown', handleKeyDown);
      document.addEventListener('visibilitychange', handleVisibility);
      return () => {
        window.removeEventListener('keydown', handleKeyDown);
        document.removeEventListener('visibilitychange', handleVisibility);
      };
    }, []);

    const showShield = () => {
      const shield = document.getElementById('screenshotShield');
      if (shield) shield.style.display = 'flex';
    };

    const hideShield = () => {
      const shield = document.getElementById('screenshotShield');
      if (shield) shield.style.display = 'none';
    };

    const handleLogin = (e) => {
      e.preventDefault();
      if (loginUsername === 'rvasava2118' && loginPassword === '191822Rahul#') {
        setUser({ username: 'Dr. R. Vasava (Admin)', role: 'admin' });
        setLoginError('');
      } else if (loginUsername.trim() !== '') {
        setUser({ username: loginUsername, role: 'student' });
        setLoginError('');
      } else {
        setLoginError('Please enter valid credentials.');
      }
    };

    const handleSocialLogin = (platform) => {
      setUser({ username: `${platform} Student User`, role: 'student' });
    };

    const handleAdminUpload = (e) => {
      e.preventDefault();
      if (!newTitle) return;
      const item = { id: Date.now(), title: newTitle, subject: newCategory || 'General', author: user.username, date: new Date().toISOString().split('T')[0] };
      setNotes([item, ...notes]);
      setNewTitle('');
      setNewCategory('');
      setNewContent('');
      alert('Content uploaded successfully!');
    };

    return (
      <div id="app">
        {/* Auth Modal if not logged in */}
        {!user && (
          <div className="auth-overlay">
            <div className="auth-card">
              <h2>AIAPGET Ayurveda Portal</h2>
              <p>Login to access video lectures, test series, notes & medicine prep</p>

              <div className="social-login">
                <button className="social-btn" onClick={() => handleSocialLogin('Google')}>
                  <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                  Continue with Google
                </button>
                <button className="social-btn" onClick={() => handleSocialLogin('WhatsApp')}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="#25D366"><path d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.77.46 3.45 1.28 4.95L2 22l5.25-1.34c1.45.79 3.08 1.22 4.79 1.22 5.52 0 10-4.48 10-10s-4.48-10-10-10zm0 18.35c-1.52 0-2.98-.41-4.28-1.19l-.31-.18-3.21.82.86-3.13-.2-.33c-.87-1.38-1.33-3-1.33-4.66 0-4.83 3.93-8.76 8.76-8.76s8.76 3.93 8.76 8.76-3.93 8.76-8.76 8.76zm4.81-6.52c-.26-.13-1.54-.76-1.78-.85-.24-.09-.42-.13-.59.13-.18.26-.68.85-.83 1.03-.15.18-.3.2-.56.07-.26-.13-1.1-.4-2.1-1.3-.78-.69-1.3-1.54-1.45-1.8-.15-.26-.02-.4.11-.53.11-.11.26-.3.39-.45.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45s-.59-1.42-.81-1.94c-.21-.5-.43-.43-.59-.44h-.5c-.18 0-.47.07-.72.34-.25.27-.96.94-.96 2.3s.98 2.67 1.12 2.85c.14.18 1.93 2.95 4.67 4.14.65.28 1.16.45 1.56.58.66.21 1.26.18 1.73.11.53-.08 1.54-.63 1.76-1.24.22-.61.22-1.13.15-1.24-.07-.11-.24-.18-.5-.31z"/></svg>
                  Continue with WhatsApp
                </button>
              </div>

              <div className="divider">or use credentials / admin login</div>

              {loginError && <p style={{ color: 'var(--error)', marginBottom: '12px' }}>{loginError}</p>}

              <form onSubmit={handleLogin}>
                <div className="form-group">
                  <label>Username / Email</label>
                  <input type="text" className="form-control" placeholder="Enter username (admin: rvasava2118)" value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>Password</label>
                  <input type="password" className="form-control" placeholder="Enter password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} required />
                </div>
                <button type="submit" className="btn-primary">Login to Portal</button>
              </form>
            </div>
          </div>
        )}

        {/* Header */}
        <header>
          <h1>AIAPGET Prep Portal</h1>
          <div className="header-right">
            {user && <span className="user-badge">{user.role === 'admin' ? '👑 Admin' : '🎓 Student'}</span>}
            <div className="user-avatar" title={user?.username}>{user ? user.username.charAt(0).toUpperCase() : 'A'}</div>
          </div>
        </header>

        {/* Navigation Tabs */}
        <nav>
          <div className="nav-tabs">
            <button className={`nav-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>Dashboard</button>
            <button className={`nav-btn ${activeTab === 'notes' ? 'active' : ''}`} onClick={() => setActiveTab('notes')}>Notes</button>
            <button className={`nav-btn ${activeTab === 'medicines' ? 'active' : ''}`} onClick={() => setActiveTab('medicines')}>Medicine Preparation</button>
            <button className={`nav-btn ${activeTab === 'materials' ? 'active' : ''}`} onClick={() => setActiveTab('materials')}>Study Materials</button>
            <button className={`nav-btn ${activeTab === 'tests' ? 'active' : ''}`} onClick={() => setActiveTab('tests')}>Test Series</button>
            {user?.role === 'admin' && <button className={`nav-btn ${activeTab === 'admin' ? 'active' : ''}`} onClick={() => setActiveTab('admin')}>Admin Panel</button>}
          </div>
        </nav>

        {/* Main Content Sections */}
        <main>
          {/* Dashboard Section */}
          <div className={`section ${activeTab === 'dashboard' ? 'active' : ''}`}>
            <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '26px', color: 'var(--primary)', marginBottom: '16px' }}>Welcome back, {user?.username || 'Scholar'}!</h2>
            <div className="grid-2">
              <div className="card">
                <h3>📚 Quick Stats</h3>
                <p><strong>Enrolled Subjects:</strong> 18 Core Ayurveda Subjects</p>
                <p><strong>Notes Available:</strong> {notes.length} verified modules</p>
                <p><strong>Medicine Formulations:</strong> {medicines.length} detailed preparations</p>
              </div>
              <div className="card">
                <h3>🔒 Security & Privacy</h3>
                <p>Screenshot and screen recording protection is <strong>active</strong> to protect copyrighted study material.</p>
              </div>
            </div>
          </div>

          {/* Notes Section */}
          <div className={`section ${activeTab === 'notes' ? 'active' : ''}`}>
            <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '26px', color: 'var(--primary)', marginBottom: '16px' }}>Ayurvedic Study Notes</h2>
            <div className="grid-2">
              {notes.map(note => (
                <div className="card" key={note.id}>
                  <span style={{ fontSize: '11px', background: 'rgba(27,67,50,0.1)', color: 'var(--primary)', padding: '3px 8px', borderRadius: '4px', fontWeight: '600' }}>{note.subject}</span>
                  <h3 style={{ marginTop: '8px' }}>{note.title}</h3>
                  <p style={{ fontSize: '13px', opacity: 0.7, margin: '8px 0' }}>Author: {note.author} • {note.date}</p>
                  <button className="btn-primary" style={{ padding: '8px 16px', fontSize: '14px', marginTop: '8px' }} onClick={() => alert(`Opening note: ${note.title}`)}>Read Note</button>
                </div>
              ))}
            </div>
          </div>

          {/* Medicine Preparation Section */}
          <div className={`section ${activeTab === 'medicines' ? 'active' : ''}`}>
            <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '26px', color: 'var(--primary)', marginBottom: '16px' }}>Ayurvedic Medicine Preparation (Bhaishajya Kalpana)</h2>
            <div className="grid-2">
              {medicines.map(med => (
                <div className="card" key={med.id}>
                  <span style={{ fontSize: '11px', background: 'rgba(176,137,104,0.15)', color: 'var(--accent)', padding: '3px 8px', borderRadius: '4px', fontWeight: '600' }}>{med.category}</span>
                  <h3 style={{ marginTop: '8px' }}>{med.name}</h3>
                  <p style={{ fontSize: '13px', margin: '8px 0' }}><strong>Key Ingredients:</strong> {med.ingredients}</p>
                  <p style={{ fontSize: '13px', opacity: 0.8, background: 'var(--bg)', padding: '10px', borderRadius: '8px' }}><strong>Manufacturing Process:</strong> {med.process}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Study Materials Section */}
          <div className={`section ${activeTab === 'materials' ? 'active' : ''}`}>
            <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '26px', color: 'var(--primary)', marginBottom: '16px' }}>Downloadable Study Materials</h2>
            <div className="grid-2">
              {materials.map(mat => (
                <div className="card" key={mat.id}>
                  <h3>{mat.title}</h3>
                  <p style={{ fontSize: '13px', opacity: 0.7, margin: '8px 0' }}>Type: {mat.type} • Size: {mat.size}</p>
                  <button className="btn-primary" style={{ padding: '8px 16px', fontSize: '14px', marginTop: '8px' }} onClick={() => alert(`Downloading secure material: ${mat.title}`)}>Download Securely</button>
                </div>
              ))}
            </div>
          </div>

          {/* Test Series Section */}
          <div className={`section ${activeTab === 'tests' ? 'active' : ''}`}>
            <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '26px', color: 'var(--primary)', marginBottom: '16px' }}>AIAPGET Mock Test Series</h2>
            <div className="card">
              <h3>All India Mock Test #1</h3>
              <p style={{ fontSize: '13px', opacity: 0.7, margin: '8px 0' }}>120 Questions • 120 Minutes • Negative Marking Enabled</p>
              <button className="btn-primary" style={{ marginTop: '12px' }} onClick={() => alert('Starting Secure Mock Test...')}>Start Test Now</button>
            </div>
          </div>

          {/* Admin Panel Section */}
          {user?.role === 'admin' && (
            <div className={`section ${activeTab === 'admin' ? 'active' : ''}`}>
              <div className="admin-banner">
                <div>
                  <h2 style={{ fontFamily: 'var(--font-heading)', fontSize: '24px' }}>Admin Control Panel</h2>
                  <p style={{ fontSize: '14px', opacity: 0.9 }}>Logged in as Dr. R. Vasava (rvasava2118)</p>
                </div>
              </div>

              <div className="card">
                <h3>Upload New Study Note or Material</h3>
                <form onSubmit={handleAdminUpload}>
                  <div className="form-group" style={{ marginTop: '12px' }}>
                    <label>Title</label>
                    <input type="text" className="form-control" placeholder="Enter title..." value={newTitle} onChange={e => setNewTitle(e.target.value)} required />
                  </div>
                  <div className="form-group">
                    <label>Subject / Category</label>
                    <input type="text" className="form-control" placeholder="e.g., Charaka, Dravyaguna, Shalya..." value={newCategory} onChange={e => setNewCategory(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label>Upload Document / Video File</label>
                    <div className="upload-box" onClick={() => alert('Select file from device')}>
                      <p>Click to browse PDF, Video, or Notes</p>
                    </div>
                  </div>
                  <button type="submit" className="btn-primary" style={{ marginTop: '16px' }}>Publish Content</button>
                </form>
              </div>
            </div>
          )}
        </main>

        {/* Mobile Footer Navigation */}
        <nav className="footer-nav">
          <button className={`footer-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V-7h-8v24zm0-18h8V3h-8v6z"/></svg>
            Dashboard
          </button>
          <button className={`footer-item ${activeTab === 'notes' ? 'active' : ''}`} onClick={() => setActiveTab('notes')}>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            Notes
          </button>
          <button className={`footer-item ${activeTab === 'medicines' ? 'active' : ''}`} onClick={() => setActiveTab('medicines')}>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 12.9 12 13.5 12 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
            Medicines
          </button>
          <button className={`footer-item ${activeTab === 'materials' ? 'active' : ''}`} onClick={() => setActiveTab('materials')}>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
            Materials
          </button>
          <button className={`footer-item ${activeTab === 'tests' ? 'active' : ''}`} onClick={() => setActiveTab('tests')}>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            Tests
          </button>
          {user?.role === 'admin' && (
            <button className={`footer-item ${activeTab === 'admin' ? 'active' : ''}`} onClick={() => setActiveTab('admin')}>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
              Admin
            </button>
          )}
        </nav>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
